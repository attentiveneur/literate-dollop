name: Build 浪神文件管理器 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 解压源码包
        run: |
          set -e
          ZIP=$(ls -1 *.zip | head -1)
          echo "找到源码包: $ZIP"
          unzip -q -o "$ZIP"
          ls -la

      - name: 定位工程
        id: locate
        run: |
          set -e
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" -type d | head -1)
          if [ -z "$PROJ" ]; then echo "没找到 .xcodeproj"; exit 1; fi
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          DIR=$(dirname "$PROJ")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "工程: $PROJ"

      - name: 编译（不签名）
        run: |
          set -e
          PROJ="${{ steps.locate.outputs.project }}"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import json,sys;d=json.load(sys.stdin);print(d['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 打 unsigned IPA
        id: ipa
        run: |
          set -e
          APP=$(find build/app.xcarchive/Products/Applications -maxdepth 1 -name "*.app" -type d | head -1)
          echo "APP=$APP"
          if [ -z "$APP" ]; then echo "没找到 .app"; exit 1; fi
          NAME=$(basename "$APP" .app)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable $NAME" "build/Payload/$(basename "$APP")/Info.plist" || true
          cd build
          /usr/bin/zip -qry "langshen-pak-v1.2.1-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh langshen-pak-v1.2.1-unsigned.ipa
          echo "ipa=$PWD/langshen-pak-v1.2.1-unsigned.ipa" >> "$GITHUB_OUTPUT"

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: langshen-pak-v1.2.1-unsigned
          path: build/langshen-pak-v1.2.1-unsigned.ipa
          if-no-files-found: error

      - name: 输出直链
        run: |
          echo "✅ ipa 直链"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "页面最下面 Artifacts → langshen-pak-v1.2.1-unsigned 下载"
